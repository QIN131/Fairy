<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairy Core</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="bg">

    <div class="grid"></div>

    <canvas id="particles"></canvas>

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="scanline"></div>

    <div id="eyeContainer">

        <svg
            id="fairyEye"
            viewBox="0 0 500 500"
        >

            <defs>

                <radialGradient
                    id="outerGradient"
                    cx="50%"
                    cy="50%"
                >
                    <stop offset="0%" stop-color="#496cff"/>
                    <stop offset="100%" stop-color="#2233d8"/>
                </radialGradient>

            </defs>

            <!-- 发光 -->

            <circle
                cx="250"
                cy="250"
                r="185"
                class="eyeGlow"
            />

            <!-- 外环 -->

            <circle
                cx="250"
                cy="250"
                r="165"
                class="outerRing"
            />

            <!-- 四尖角 -->

            <g class="spikes">

                <polygon
                    points="250,40 275,90 225,90"
                />

                <polygon
                    points="460,250 410,225 410,275"
                />

                <polygon
                    points="250,460 225,410 275,410"
                />

                <polygon
                    points="40,250 90,225 90,275"
                />

            </g>

            <!-- 白环 -->

            <circle
                cx="250"
                cy="250"
                r="110"
                class="whiteRing"
            />

            <!-- C环 -->

            <circle
                cx="250"
                cy="250"
                r="72"
                class="iris"
            />

            <!-- 瞳孔 -->

            <circle
                cx="250"
                cy="250"
                r="42"
                class="pupil"
            />

            <!-- 高光 -->

            <circle
                cx="312"
                cy="312"
                r="18"
                class="highlight"
            />

        </svg>

    </div>

</div>

<script src="js/main.js"></script>

</body>
</html>
